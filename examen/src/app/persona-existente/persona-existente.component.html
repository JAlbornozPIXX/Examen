<div class="flex flex-col mt-0">
  <mat-toolbar color="primary">
    <button
      mat-icon-button
      [matMenuTriggerFor]="menu"
      aria-label="Example icon-button with a menu"
    >
      <mat-icon>more_vert</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <button mat-menu-item (click)="dashboard()">
        <mat-icon>dashboard</mat-icon>
        <span>Ir a Dashboard</span>
      </button>
      <button mat-menu-item (click)="openDialog()">
        <mat-icon>add</mat-icon>
        <span>Ingresar personal</span>
      </button>
      <button mat-menu-item (click)="openCargos()">
        <mat-icon>add_circle</mat-icon>
        <span>Administrar Cargos</span>
      </button>
      <button mat-menu-item (click)="cerrarSesion()">
        <mat-icon>close</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
    <span class="font-sans">Personal Existente</span>
    <span class="espacio"></span>
  </mat-toolbar>

  <div class="my-4 mx-4"> 
    <table mat-table [dataSource]="datos" class="mat-elevation-z8 ">
      <ng-container matColumnDef="Alias">
        <th mat-header-cell *matHeaderCellDef>Alias</th>
        <td mat-cell *matCellDef="let dato">
          {{ dato.Nombres + " " + dato.Apellidos }}
        </td>
      </ng-container>

      <ng-container matColumnDef="Nombres">
        <th mat-header-cell *matHeaderCellDef>Nombres</th>
        <td mat-cell *matCellDef="let dato">{{ dato.Nombres }}</td>
      </ng-container>

      <ng-container matColumnDef="Apellido">
        <th mat-header-cell *matHeaderCellDef>Apellidos</th>
        <td mat-cell *matCellDef="let dato">{{ dato.Apellidos }}</td>
      </ng-container>

      <ng-container matColumnDef="Rut">
        <th mat-header-cell *matHeaderCellDef>Rut</th>
        <td mat-cell *matCellDef="let dato">
          {{ dato.RUN + "-" + dato.Verificador }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
