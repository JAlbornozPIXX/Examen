<h2 mat-dialog-title>Administrar Cargos</h2>
<mat-dialog-content class="mat-typography">
<div class="flex flex-col w-80 max-w-80">
    <form class="example-form">
        <mat-form-field class="max-w-60 ">
            <mat-label>Añadir Cargo</mat-label>
            <input matInput [formControl]="form.get('Nombre')">
        </mat-form-field>
        <mat-dialog-actions>
          <button mat-raised-button color="primary" [mat-dialog-close]="true" cdkFocusInitial (click)="entradaNuevoCargo()">Aceptar</button>
        </mat-dialog-actions>
        <div class="my-4 mx-4"> 
            <table mat-table [dataSource]="datos" class="mat-elevation-z8 ">
        
              <ng-container matColumnDef="Nombre">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let dato">{{ dato.Nombre }}</td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>      
              <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
          </div>
      </form>
    </div>
      
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Finalizar</button> 
</mat-dialog-actions>
