<h2 mat-dialog-title>Ingresar personal</h2>
<mat-dialog-content class="mat-typography">
<div class="flex flex-col w-80 max-w-80">
    <form class="example-form">
        <mat-form-field class="max-w-60">
          <mat-label>Alias</mat-label>
          <input matInput [formControl]="form.get('Alias')">
        </mat-form-field>
        <mat-form-field class="max-w-60 ">
            <mat-label>Nombres</mat-label>
            <input matInput [formControl]="form.get('Nombres')">
        </mat-form-field>
        <mat-form-field class="max-w-60 ">
            <mat-label>Apellidos</mat-label>
            <input matInput [formControl]="form.get('Apellidos')">
        </mat-form-field>
        <mat-form-field class="max-w-60 ">
            <mat-label>Run</mat-label>
            <input matInput [formControl]="form.get('RUN')">
        </mat-form-field>
        <mat-form-field class="max-w-60 ">
            <mat-label>Dig. verificador</mat-label>
            <input matInput [formControl]="form.get('Verificador')">
        </mat-form-field>
      </form>
    </div>
      
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="true" cdkFocusInitial>Aceptar</button>
</mat-dialog-actions>
